services:
  shit-bot:
    image: ghcr.io/elysola/shit-bot:latest
    container_name: shit-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      # - ./plugins:/app/data/plugins   # 外部插件目录（可选）
    environment:
      - TZ=Asia/Shanghai
