# ─── Platform credentials & global settings ───────────────────────────────────

sendAsImage = true
enableApproval = true
pollIntervalMinutes = 5
maxPostsPerFetch = 20
maxTweetAgeMinutes = 60
imageCacheTtlMinutes = 60
xToImageApiUrl = ""
xToImageApiToken = ""
xToImageApiTheme = "dark"

[discord]
enabled = false
token = "YOUR_DISCORD_BOT_TOKEN"
embedColor = "#1DA1F2"

[discord.privilegedIntents]   # 特权 intent：auto = 读取开发者后台的开关自动决定；on / off = 强制
members = "auto"          # 成员列表（昵称、角色、进出服务器）
presences = "auto"        # 在线状态、正在玩什么

[telegram]
enabled = true
token = "YOUR_TELEGRAM_BOT_TOKEN"
parseMode = "HTML"
apiRoot = ""

[twitter]
enabled = true          # 设为 false 可关闭推文监控, 只跑 AI 聊天 / WebUI
authToken = ""
ct0 = ""
username = ""
password = ""
email = ""
totpSecret = ""

[webui]
enabled = true
port = 3000
host = "0.0.0.0"
password = ""

[[plugins]]
name = "ai-chat"
enabled = true                # 插件开关（关掉后完全不加载）

[plugins.options]
enabled = false
apiUrl = "https://api.openai.com/v1"
apiKey = ""               # 环境变量 AI_API_KEY
model = "gpt-3.5-turbo"
systemPrompt = "你是一个有帮助的助手。"   # 只在一张人设卡都没有时使用；首次生成默认人设卡时会并入卡里
maxTokens = 1024
temperature = 0.7
allowedGuildIds = []      # 空 = 所有服务器
maxToolIterations = 12
reactions = true          # 让模型在最终回复里返回 emoji 短码, 给用户消息贴表情反应
ignoreEveryoneMention = true   # @everyone / @here 不算叫到 bot

[plugins.options.webSearch]
enabled = false
provider = "duckduckgo"   # duckduckgo | tavily | serper | brave | searxng
apiKey = ""               # tavily / serper / brave 需要
baseUrl = ""              # searxng 实例地址
maxResults = 5

[plugins.options.persona]              # 人设卡（data/personas/<id>.yaml，首次启动自动生成 memecat）
dir = "data/personas"
default = "memecat"
guilds = {}               # 按服务器指定人设卡：{ "服务器ID" = "人设卡ID" }

[plugins.options.lore]
dir = "data/lore"         # 设定集（关键词触发的世界观 / 梗 / 群规条目）

[plugins.options.history]              # 启动 / 重连时自动回望补全历史消息
gapFillOnStartup = true
initialDays = 30
maxMessagesPerChannel = 5000
includeThreads = true
archivedThreadDays = 30
requestIntervalMs = 350

[plugins.options.memory]
enabled = true

[plugins.options.memory.observe]       # 被动观察：所有成员在所有可见频道的消息都入库（不只是和 bot 聊天时）；关掉后只记和 bot 的直接对话
enabled = true
channelDenylist = []      # 不观察的频道 / 分类 ID
retentionDays = 0         # 原始消息保留天数，0 = 永久（提炼出的记忆不受影响）
crossGuildMessages = false   # 是否允许模型跨服务器查看某人的原话

[plugins.options.memory.extractor]     # 后台提炼用的模型；空 = 沿用上面的 model / apiUrl / apiKey
model = ""
apiUrl = ""
apiKey = ""               # 环境变量 AI_EXTRACTOR_API_KEY
windowMessages = 40
idleSeconds = 180         # 频道安静多久后提炼
maxWaitMinutes = 30       # 一直有人说话时最多攒多久
images = true             # 提炼时看图
maxImagesPerWindow = 4
concurrency = 1
dailyTokenBudget = 3000000   # 提炼和画像每天的 token 上限（互动评估的用量计入但不受限），0 = 不限
minIntervalMs = 0         # 后台请求（提炼、画像、互动评估）之间的最小间隔（毫秒），上游有频率限制时调大；0 = 不限

[plugins.options.memory.core]          # 每次聊天都会带上的核心记忆
userPins = 12
guildPins = 20
selfPins = 10
autoPinImportance = 8     # 重要度 ≥ 8 的新记忆自动置顶；11 = 永不
upcomingDays = 7          # 近期计划 / 事件提前几天带上

[plugins.options.memory.context]       # 每轮上下文的字数预算
speakerChars = 1200
mentionedChars = 500
mentionedUsers = 3
guildChars = 1000
selfChars = 600
loreChars = 1000
recentChannelMessages = 15
recentChannelChars = 2000
autoRecall = 0            # 每轮自动附带的相关记忆条数，0 = 只靠模型调用工具

[plugins.options.memory.tools]
maxResultChars = 30000

[plugins.options.embedding]            # 向量模型（OpenAI 兼容 /embeddings）；apiUrl 和 model 都留空 = 不做向量化
apiUrl = ""               # 例：本机 Ollama http://127.0.0.1:11434/v1
apiKey = ""               # 环境变量 AI_EMBEDDING_API_KEY
model = ""                # 例：bge-m3
dimensions = 0            # 0 = 用模型默认维度
batchSize = 32
timeoutMs = 8000
queryPrefix = ""
documentPrefix = ""

[plugins.options.vector]
backend = "auto"          # auto | sqlite（sqlite-vec，在数据库里算）| js（纯 JS 兜底）
extensionPath = ""        # 自定义 sqlite-vec 扩展路径；空 = 用 npm 包自带的
customSqlitePath = ""     # macOS：支持加载扩展的 libsqlite3 路径
exactThreshold = 3000     # 候选不超过这么多条时直接精确计算
coarseK = 200             # 否则先二值粗筛这么多条再精确重排

[plugins.options.affinity]             # 好感度（-100..100，6 档；只影响语气和态度，数值不对用户展示）
enabled = true
maxGainPerInteraction = 5
maxLossPerInteraction = 8
dailyGainCap = 15
dailyLossCap = 30

[plugins.options.affinity.decay]
enabled = true
afterDays = 14
pointsPerWeek = 1

[plugins.options.mood]                 # 情绪（效价 × 唤醒度；基线和作息在人设卡里）
enabled = true
valenceHalfLifeHours = 3
arousalHalfLifeHours = 1
maxUserImpactPerHour = 0.5

[plugins.options.proactive]            # 主动插话
enabled = true
channels = []             # 白名单；空 = 所有被观察的频道
denyChannels = []
threshold = 0.35
debounceSeconds = 25
forceEvalEveryMessages = 20
cooldownMinutes = 10
aliasCooldownSeconds = 60     # 被叫到名字时的冷却
maxPerHourPerChannel = 3
maxPerDay = 40
maxJudgeCallsPerDay = 400
quietHours = ""           # "HH:MM-HH:MM"（UTC+8）；空 = 按人设作息
allowReactOnly = true     # 允许只贴表情不说话
judgeModel = ""           # 空 = 沿用 extractor.model

[plugins.options.summary]
enabled = false               # @机器人 "总结一下上面的200条消息" 时生效
maxMessagesPerChannel = 500    # 单次最多读取 / 总结多少条
defaultCount = 100             # 未指定条数时默认总结多少条

